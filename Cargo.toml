[package]
name = "rtk-web"
version = "0.1.1"
edition = "2021"
rust-version = "1.91"
publish = false
description = "HTTP service that compresses bash / PowerShell output with the rtk engine"

[dependencies]
rtk = { path = "vendor/rtk" }
rtk-engine = { path = "vendor/rtk/engine" }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true